        // ================= ФИЗИКА И КОЛЛИЗИИ (SLIDING COLLISION) =================
        function resolveCollisions(pos, radius) {
            // 1. AABB здания и границы карты
            for (let i = 0; i < colliders.length; i++) {
                const box = colliders[i];
                const closestX = Math.max(box.minX, Math.min(pos.x, box.maxX));
                const closestZ = Math.max(box.minZ, Math.min(pos.z, box.maxZ));

                const dx = pos.x - closestX;
                const dz = pos.z - closestZ;
                const distSq = dx * dx + dz * dz;

                if (distSq < radius * radius) {
                    const dist = Math.sqrt(distSq);
                    if (dist > 0.0001) {
                        const overlap = radius - dist;
                        pos.x += (dx / dist) * overlap;
                        pos.z += (dz / dist) * overlap;
                    } else {
                        pos.x += radius;
                    }
                }
            }

            // 2. Круговые препятствия (деревья, фонари, фонтан)
            for (let i = 0; i < circleColliders.length; i++) {
                const c = circleColliders[i];
                const dx = pos.x - c.x;
                const dz = pos.z - c.z;
                const minDist = radius + c.r;
                const distSq = dx * dx + dz * dz;

                if (distSq < minDist * minDist) {
                    const dist = Math.sqrt(distSq) || 0.001;
                    const overlap = minDist - dist;
                    pos.x += (dx / dist) * overlap;
                    pos.z += (dz / dist) * overlap;
                }
            }
        }

        // ================= УПРАВЛЕНИЕ ИГРОКОМ, АВТО И ИИ =================
        function getCombinedInput() {
            let moveX = input.joyX;
            let moveY = input.joyY;

            if (input.keys['KeyA'] || input.keys['ArrowLeft']) moveX -= 1;
            if (input.keys['KeyD'] || input.keys['ArrowRight']) moveX += 1;
            if (input.keys['KeyW'] || input.keys['ArrowUp']) moveY -= 1;
            if (input.keys['KeyS'] || input.keys['ArrowDown']) moveY += 1;

            const len = Math.hypot(moveX, moveY);
            if (len > 1) {
                moveX /= len;
                moveY /= len;
            }

            const jump = input.jump || input.keys['Space'];
            const gas = input.gas || input.keys['KeyW'] || input.keys['ArrowUp'];
            const brake = input.brake || input.keys['KeyS'] || input.keys['ArrowDown'] || input.keys['Space'];

            return { moveX, moveY, jump, gas, brake };
        }

        function updatePlayerOnFoot(dt) {
            const ctrl = getCombinedInput();
            const moveSpeed = 10.5;

            // Вектор движения относительно угла обзора камеры
            const inputMag = Math.hypot(ctrl.moveX, ctrl.moveY);
            if (inputMag > 0.05) {
                const camForwardX = -Math.sin(state.cameraYaw);
                const camForwardZ = -Math.cos(state.cameraYaw);
                const camRightX = Math.cos(state.cameraYaw);
                const camRightZ = -Math.sin(state.cameraYaw);

                const dirX = camForwardX * (-ctrl.moveY) + camRightX * ctrl.moveX;
                const dirZ = camForwardZ * (-ctrl.moveY) + camRightZ * ctrl.moveX;

                player.vel.x = dirX * moveSpeed;
                player.vel.z = dirZ * moveSpeed;

                // Плавный поворот персонажа в сторону бега
                const targetRot = Math.atan2(dirX, dirZ);
                let diff = targetRot - player.rotY;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.rotY += diff * Math.min(1, dt * 14);
            } else {
                player.vel.x *= Math.pow(0.001, dt);
                player.vel.z *= Math.pow(0.001, dt);
            }

            // Прыжок и гравитация
            if (ctrl.jump && player.grounded) {
                player.vel.y = 9.2;
                player.grounded = false;
            }
            player.vel.y -= 24.0 * dt;

            player.pos.x += player.vel.x * dt;
            player.pos.z += player.vel.z * dt;
            player.pos.y += player.vel.y * dt;

            if (player.pos.y <= 0) {
                player.pos.y = 0;
                player.vel.y = 0;
                player.grounded = true;
            }

            // Коллизии со зданиями и припаркованными машинами
            resolveCollisions(player.pos, player.radius);
            vehicles.forEach(v => {
                const dx = player.pos.x - v.pos.x;
                const dz = player.pos.z - v.pos.z;
                const minDist = player.radius + v.radius * 0.85;
                const dSq = dx * dx + dz * dz;
                if (dSq < minDist * minDist) {
                    const d = Math.sqrt(dSq) || 0.01;
                    player.pos.x += (dx / d) * (minDist - d);
                    player.pos.z += (dz / d) * (minDist - d);
                }
            });

            player.mesh.position.copy(player.pos);
            player.mesh.rotation.y = player.rotY;

            // Процедурная анимация рук и ног
            const horizSpeed = Math.hypot(player.vel.x, player.vel.z);
            if (!player.grounded) {
                player.leftLeg.rotation.x = -0.45;
                player.rightLeg.rotation.x = 0.35;
                player.leftArm.rotation.x = -0.8;
                player.rightArm.rotation.x = -0.8;
            } else if (horizSpeed > 0.5) {
                player.walkCycle += dt * horizSpeed * 1.35;
                const swing = Math.sin(player.walkCycle) * 0.75;
                player.leftLeg.rotation.x = swing;
                player.rightLeg.rotation.x = -swing;
                player.leftArm.rotation.x = -swing * 0.8;
                player.rightArm.rotation.x = swing * 0.8;
            } else {
                player.leftLeg.rotation.x *= 0.8;
                player.rightLeg.rotation.x *= 0.8;
                player.leftArm.rotation.x *= 0.8;
                player.rightArm.rotation.x *= 0.8;
            }

            // Поиск ближайшей машины для кнопки "Сесть в авто"
            let closest = null;
            let closestDist = 4.6;
            vehicles.forEach(v => {
                const d = player.pos.distanceTo(v.pos);
                if (d < closestDist) {
                    closestDist = d;
                    closest = v;
                }
            });
            state.nearestVehicle = closest;
            const enterBtn = document.getElementById('btn-enter-car');
            enterBtn.style.display = closest ? 'flex' : 'none';
        }

        function enterVehicle(veh) {
            if (!veh) return;
            state.mode = 'incar';
            state.currentVehicle = veh;
            veh.isPlayerControlled = true;
            veh.isTraffic = false; // Игрок перехватывает управление даже у машины трафика!

            player.mesh.visible = false;

            document.getElementById('onfoot-controls').classList.add('hidden');
            document.getElementById('incar-controls').classList.remove('hidden');
            document.getElementById('speedometer').style.display = 'block';

            // Показываем название авто в стиле GTA
            const toast = document.getElementById('vehicle-name-toast');
            toast.textContent = veh.name;
            toast.classList.add('visible');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('visible'), 2500);
        }

        function exitVehicle() {
            const veh = state.currentVehicle;
            if (!veh) return;

            veh.isPlayerControlled = false;
            state.mode = 'onfoot';
            state.currentVehicle = null;

            // Высаживаем игрока слева от водительской двери
            const leftX = Math.cos(veh.rotY) * 2.3;
            const leftZ = -Math.sin(veh.rotY) * 2.3;
            player.pos.set(veh.pos.x + leftX, 0, veh.pos.z + leftZ);
            resolveCollisions(player.pos, player.radius);

            player.vel.set(0, 0, 0);
            player.rotY = veh.rotY;
            player.mesh.position.copy(player.pos);
            player.mesh.visible = true;

            document.getElementById('incar-controls').classList.add('hidden');
            document.getElementById('onfoot-controls').classList.remove('hidden');
            document.getElementById('speedometer').style.display = 'none';
        }

        function updateVehicles(dt) {
            const ctrl = getCombinedInput();

            vehicles.forEach(v => {
                if (v.isPlayerControlled) {
                    // --- АРКАДНАЯ ФИЗИКА ВОЖДЕНИЯ ИГРОКА ---
                    if (ctrl.gas) {
                        v.speed += v.accel * dt;
                    } else if (ctrl.brake) {
                        if (v.speed > 1.0) {
                            v.speed -= v.accel * 1.6 * dt; // Активное торможение
                        } else {
                            v.speed -= v.accel * 0.65 * dt; // Задний ход
                        }
                    } else {
                        // Естественное трение качения
                        v.speed *= Math.pow(0.28, dt);
                        if (Math.abs(v.speed) < 0.1) v.speed = 0;
                    }

                    v.speed = Math.max(-v.maxSpeed * 0.45, Math.min(v.maxSpeed, v.speed));

                    // Поворот руля (плавный отклик от стика)
                    const targetSteer = -ctrl.moveX * 0.55;
                    v.steerAngle += (targetSteer - v.steerAngle) * Math.min(1, dt * 10);

                    // Поворот кузова зависит от скорости и направления движения
                    if (Math.abs(v.speed) > 0.3) {
                        const speedFactor = Math.min(1, Math.abs(v.speed) / 8);
                        const reverseSign = v.speed >= 0 ? 1 : -1;
                        v.rotY += v.steerAngle * 2.6 * speedFactor * reverseSign * dt;
                    }

                    // Синхронизируем камеру мягко за машиной, если пользователь не крутит ее пальцем
                    if (!cameraTouchActive && Math.abs(v.speed) > 2.0) {
                        const desiredCamYaw = v.rotY + Math.PI;
                        let diff = desiredCamYaw - state.cameraYaw;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        state.cameraYaw += diff * Math.min(1, dt * 2.2);
                    }

                    // Спидометр (переводим единицы/сек в реалистичные км/ч)
                    const kmh = Math.round(Math.abs(v.speed) * 4.2);
                    document.getElementById('speed-value').textContent = kmh;

                } else if (v.isTraffic && v.route) {
                    // --- ИИ ТРАФИКА ПО WAYPOINTS ---
                    const target = v.route[v.waypointIdx];
                    const dx = target.x - v.pos.x;
                    const dz = target.z - v.pos.z;
                    const distToWp = Math.hypot(dx, dz);

                    if (distToWp < 4.5) {
                        v.waypointIdx = (v.waypointIdx + 1) % v.route.length;
                    }

                    const desiredRot = Math.atan2(dx, dz);
                    let angleDiff = desiredRot - v.rotY;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                    v.steerAngle = Math.max(-0.5, Math.min(0.5, angleDiff));
                    v.rotY += angleDiff * Math.min(1, dt * 4.5);

                    // Проверка препятствий впереди (игрок, пешеходы, другие машины)
                    let obstacleAhead = false;
                    const fwdX = Math.sin(v.rotY);
                    const fwdZ = Math.cos(v.rotY);

                    // Проверка игрока пешком
                    if (state.mode === 'onfoot') {
                        const px = player.pos.x - v.pos.x;
                        const pz = player.pos.z - v.pos.z;
                        const dot = px * fwdX + pz * fwdZ;
                        const side = Math.abs(px * fwdZ - pz * fwdX);
                        if (dot > 0 && dot < 11 && side < 2.6) obstacleAhead = true;
                    }

                    // Проверка других машин
                    for (let j = 0; j < vehicles.length; j++) {
                        const other = vehicles[j];
                        if (other === v) continue;
                        const ox = other.pos.x - v.pos.x;
                        const oz = other.pos.z - v.pos.z;
                        const dot = ox * fwdX + oz * fwdZ;
                        const side = Math.abs(ox * fwdZ - oz * fwdX);
                        if (dot > 0 && dot < 10.5 && side < 2.6) {
                            obstacleAhead = true;
                            break;
                        }
                    }

                    // Проверка пешеходов
                    if (!obstacleAhead) {
                        for (let j = 0; j < pedestrians.length; j++) {
                            const ped = pedestrians[j];
                            const px = ped.pos.x - v.pos.x;
                            const pz = ped.pos.z - v.pos.z;
                            const dot = px * fwdX + pz * fwdZ;
                            const side = Math.abs(px * fwdZ - pz * fwdX);
                            if (dot > 0 && dot < 9.5 && side < 2.4) {
                                obstacleAhead = true;
                                break;
                            }
                        }
                    }

                    const targetTrafficSpeed = obstacleAhead ? 0 : (Math.abs(angleDiff) > 0.35 ? 8.5 : 13.5);
                    v.speed += (targetTrafficSpeed - v.speed) * Math.min(1, dt * (obstacleAhead ? 8 : 3));
                } else {
                    // Припаркованная машина гасит инерцию после удара
                    v.speed *= Math.pow(0.05, dt);
                    v.steerAngle *= 0.85;
                }

                // Перемещение автомобиля
                const moveX = Math.sin(v.rotY) * v.speed * dt;
                const moveZ = Math.cos(v.rotY) * v.speed * dt;
                v.pos.x += moveX;
                v.pos.z += moveZ;

                // Коллизии со зданиями и деревьями (с потерей скорости при ударе)
                const beforeX = v.pos.x;
                const beforeZ = v.pos.z;
                resolveCollisions(v.pos, v.radius);
                if (Math.hypot(v.pos.x - beforeX, v.pos.z - beforeZ) > 0.02) {
                    v.speed *= 0.72;
                }

                // Вращение и поворот колес
                v.frontPivots.forEach(p => p.rotation.y = v.steerAngle);
                v.wheels.forEach(w => w.rotation.x += v.speed * dt * 2.2);

                // Легкий крен кузова при повороте на скорости
                const bodyRoll = -v.steerAngle * (v.speed / v.maxSpeed) * 0.08;
                v.mesh.rotation.z = bodyRoll;
                v.mesh.rotation.y = v.rotY;
                v.mesh.position.copy(v.pos);

                // Привязываем координаты игрока к машине, если он внутри
                if (v.isPlayerControlled) {
                    player.pos.copy(v.pos);
                }
            });

            // Столкновения машин между собой (упругое расталкивание)
            for (let i = 0; i < vehicles.length; i++) {
                for (let j = i + 1; j < vehicles.length; j++) {
                    const a = vehicles[i];
                    const b = vehicles[j];
                    const dx = b.pos.x - a.pos.x;
                    const dz = b.pos.z - a.pos.z;
                    const minDist = a.radius + b.radius;
                    const dSq = dx * dx + dz * dz;
                    if (dSq < minDist * minDist && dSq > 0.0001) {
                        const d = Math.sqrt(dSq);
                        const overlap = (minDist - d) * 0.5;
                        const nx = dx / d;
                        const nz = dz / d;
                        a.pos.x -= nx * overlap;
                        a.pos.z -= nz * overlap;
                        b.pos.x += nx * overlap;
                        b.pos.z += nz * overlap;
                        a.speed *= 0.75;
                        b.speed *= 0.75;
                    }
                }
            }
        }

        function updatePedestrians(dt) {
            pedestrians.forEach(ped => {
                const target = ped.waypoints[ped.wpIdx];
                const dx = target.x - ped.pos.x;
                const dz = target.z - ped.pos.z;
                const dist = Math.hypot(dx, dz);

                if (dist < 1.2) {
                    ped.wpIdx = (ped.wpIdx + 1) % ped.waypoints.length;
                }

                const dirX = dx / (dist || 1);
                const dirZ = dz / (dist || 1);

                // Проверка препятствий перед пешеходом (машины или игрок)
                let blocked = false;
                for (let i = 0; i < vehicles.length; i++) {
                    const v = vehicles[i];
                    const vx = v.pos.x - ped.pos.x;
                    const vz = v.pos.z - ped.pos.z;
                    const dot = vx * dirX + vz * dirZ;
                    const side = Math.abs(vx * dirZ - vz * dirX);
                    if (dot > 0 && dot < 4.5 && side < 2.2) {
                        blocked = true;
                        break;
                    }
                }

                if (!blocked) {
                    ped.pos.x += dirX * ped.speed * dt;
                    ped.pos.z += dirZ * ped.speed * dt;
                    resolveCollisions(ped.pos, 0.55);

                    const targetRot = Math.atan2(dirX, dirZ);
                    let diff = targetRot - ped.rotY;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    ped.rotY += diff * Math.min(1, dt * 8);

                    ped.walkCycle += dt * ped.speed * 2.2;
                    const swing = Math.sin(ped.walkCycle) * 0.65;
                    ped.leftLeg.rotation.x = swing;
                    ped.rightLeg.rotation.x = -swing;
                    ped.leftArm.rotation.x = -swing * 0.7;
                    ped.rightArm.rotation.x = swing * 0.7;
                } else {
                    ped.leftLeg.rotation.x *= 0.8;
                    ped.rightLeg.rotation.x *= 0.8;
                    ped.leftArm.rotation.x *= 0.8;
                    ped.rightArm.rotation.x *= 0.8;
                }

                ped.mesh.position.copy(ped.pos);
                ped.mesh.rotation.y = ped.rotY;
            });
        }

        function updatePickups(dt, elapsed) {
            const moneyEl = document.getElementById('money-display');

            moneyPickups.forEach(p => {
                if (!p.active) {
                    p.respawnTimer -= dt;
                    if (p.respawnTimer <= 0) {
                        p.active = true;
                        p.mesh.visible = true;
                    }
                    return;
                }

                p.mesh.rotation.y = elapsed * 2.5;
                p.mesh.position.y = 0.85 + Math.sin(elapsed * 4) * 0.15;

                // Подбор игроком (пешком или на авто)
                const collectDist = state.mode === 'incar' ? 3.2 : 1.8;
                if (player.pos.distanceTo(p.pos) < collectDist) {
                    p.active = false;
                    p.mesh.visible = false;
                    p.respawnTimer = 25; // Появится снова через 25 сек

                    state.money += p.amount;
                    moneyEl.textContent = '$' + String(state.money).padStart(8, '0');
                    moneyEl.classList.add('pop');
                    setTimeout(() => moneyEl.classList.remove('pop'), 220);
                }
            });
        }

        // ================= КАМЕРА ОТ ТРЕТЬЕГО ЛИЦА =================
        function updateCamera(dt) {
            const targetPos = state.mode === 'incar' && state.currentVehicle
                ? state.currentVehicle.pos
                : player.pos;

            const desiredDist = state.mode === 'incar' ? 11.5 : 8.2;
            state.cameraDist += (desiredDist - state.cameraDist) * Math.min(1, dt * 5);

            const lookAtPoint = new THREE.Vector3(
                targetPos.x,
                targetPos.y + (state.mode === 'incar' ? 1.8 : 2.1),
                targetPos.z
            );

            const horizDist = Math.cos(state.cameraPitch) * state.cameraDist;
            const vertDist = Math.sin(state.cameraPitch) * state.cameraDist;

            const desiredCamPos = new THREE.Vector3(
                lookAtPoint.x + Math.sin(state.cameraYaw) * horizDist,
                lookAtPoint.y + vertDist,
                lookAtPoint.z + Math.cos(state.cameraYaw) * horizDist
            );

            // Ограничение высоты камеры над землей и защита от залета за границы карты
            desiredCamPos.y = Math.max(1.4, desiredCamPos.y);
            desiredCamPos.x = Math.max(-HALF_WORLD + 2, Math.min(HALF_WORLD - 2, desiredCamPos.x));
            desiredCamPos.z = Math.max(-HALF_WORLD + 2, Math.min(HALF_WORLD - 2, desiredCamPos.z));

            camera.position.lerp(desiredCamPos, Math.min(1, dt * 12));
            camera.lookAt(lookAtPoint);

            // Перемещаем центр теневой камеры за игроком (60 FPS оптимизация!)
            dirLight.position.set(targetPos.x + 45, 75, targetPos.z + 35);
            dirLight.target.position.set(targetPos.x, 0, targetPos.z);
            dirLight.target.updateMatrixWorld();
        }

        // ================= 2D МИНИ-КАРТА (CANVAS) =================
        const minimapCanvas = document.getElementById('minimap-canvas');
        const mmCtx = minimapCanvas.getContext('2d');

        function renderMinimap() {
            const w = minimapCanvas.width;
            const h = minimapCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const scale = 0.72; // Масштаб мира на радаре

            mmCtx.clearRect(0, 0, w, h);

            // Фон радара
            mmCtx.fillStyle = '#2d3436';
            mmCtx.fillRect(0, 0, w, h);

            mmCtx.save();
            mmCtx.translate(cx, cy);

            const px = player.pos.x;
            const pz = player.pos.z;

            // Дороги
            mmCtx.fillStyle = '#636e72';
            ROAD_COORDS.forEach(rc => {
                // Горизонтальная дорога
                mmCtx.fillRect((-HALF_WORLD - px) * scale, (rc - ROAD_WIDTH / 2 - pz) * scale, WORLD_SIZE * scale, ROAD_WIDTH * scale);
                // Вертикальная дорога
                mmCtx.fillRect((rc - ROAD_WIDTH / 2 - px) * scale, (-HALF_WORLD - pz) * scale, ROAD_WIDTH * scale, WORLD_SIZE * scale);
            });

            // Здания и парк
            buildingsData.forEach(b => {
                mmCtx.fillStyle = b.isPark ? '#2ecc71' : '#b2bec3';
                mmCtx.fillRect(
                    (b.x - b.w / 2 - px) * scale,
                    (b.z - b.d / 2 - pz) * scale,
                    b.w * scale,
                    b.d * scale
                );
            });

            // Пачки денег (зеленые точки)
            mmCtx.fillStyle = '#55efc4';
            moneyPickups.forEach(m => {
                if (!m.active) return;
                mmCtx.beginPath();
                mmCtx.arc((m.pos.x - px) * scale, (m.pos.z - pz) * scale, 2.5, 0, Math.PI * 2);
                mmCtx.fill();
            });

            // Пешеходы (белые точки)
            mmCtx.fillStyle = '#ffffff';
            pedestrians.forEach(ped => {
                mmCtx.beginPath();
                mmCtx.arc((ped.pos.x - px) * scale, (ped.pos.z - pz) * scale, 2, 0, Math.PI * 2);
                mmCtx.fill();
            });

            // Транспорт (цветные прямоугольники)
            vehicles.forEach(v => {
                if (v.isPlayerControlled) return;
                mmCtx.save();
                mmCtx.translate((v.pos.x - px) * scale, (v.pos.z - pz) * scale);
                mmCtx.rotate(-v.rotY);
                mmCtx.fillStyle = v.isTraffic ? '#feca57' : '#ff6b6b';
                mmCtx.fillRect(-2.5, -4, 5, 8);
                mmCtx.restore();
            });

            // Маркер игрока в центре (стрелка направления)
            const playerYaw = state.mode === 'incar' && state.currentVehicle
                ? state.currentVehicle.rotY
                : player.rotY;

            mmCtx.rotate(-playerYaw + Math.PI);
            mmCtx.fillStyle = '#ffdd59';
            mmCtx.strokeStyle = '#000000';
            mmCtx.lineWidth = 1.5;
            mmCtx.beginPath();
            mmCtx.moveTo(0, -7);
            mmCtx.lineTo(5, 6);
            mmCtx.lineTo(0, 3);
            mmCtx.lineTo(-5, 6);
            mmCtx.closePath();
            mmCtx.fill();
            mmCtx.stroke();

            mmCtx.restore();
        }

        // ================= МУЛЬТИТАЧ УПРАВЛЕНИЕ И КЛАВИАТУРА =================
        let joyTouchId = null;
        let cameraTouchId = null;
        let cameraTouchActive = false;
        let lastCamX = 0;
        let lastCamY = 0;

        const joyZone = document.getElementById('joystick-zone');
        const joyBase = document.getElementById('joystick-base');
        const joyKnob = document.getElementById('joystick-knob');
        const maxJoyRadius = 42;

        function updateJoystick(clientX, clientY) {
            const rect = joyBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);

            if (dist > maxJoyRadius) {
                dx = (dx / dist) * maxJoyRadius;
                dy = (dy / dist) * maxJoyRadius;
            }

            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            input.joyX = dx / maxJoyRadius;
            input.joyY = dy / maxJoyRadius;
        }

        function resetJoystick() {
            joyTouchId = null;
            joyKnob.style.transform = 'translate(0px, 0px)';
            input.joyX = 0;
            input.joyY = 0;
        }

        joyZone.addEventListener('touchstart', e => {
            e.preventDefault();
            if (joyTouchId === null && e.changedTouches.length > 0) {
                const t = e.changedTouches[0];
                joyTouchId = t.identifier;
                updateJoystick(t.clientX, t.clientY);
            }
        }, { passive: false });

        joyZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joyTouchId) {
                    updateJoystick(t.clientX, t.clientY);
                }
            }
        }, { passive: false });

        const endJoyHandler = e => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    resetJoystick();
                }
            }
        };
        joyZone.addEventListener('touchend', endJoyHandler);
        joyZone.addEventListener('touchcancel', endJoyHandler);

        // Вращение камеры свайпом пальца по экрану
        const camZone = document.getElementById('camera-touch-zone');
        camZone.addEventListener('touchstart', e => {
            if (cameraTouchId === null && e.changedTouches.length > 0) {
                const t = e.changedTouches[0];
                cameraTouchId = t.identifier;
                cameraTouchActive = true;
                lastCamX = t.clientX;
                lastCamY = t.clientY;
            }
        }, { passive: true });

        camZone.addEventListener('touchmove', e => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === cameraTouchId) {
                    const dx = t.clientX - lastCamX;
                    const dy = t.clientY - lastCamY;
                    lastCamX = t.clientX;
                    lastCamY = t.clientY;

                    state.cameraYaw -= dx * 0.0065;
                    state.cameraPitch = Math.max(0.12, Math.min(0.85, state.cameraPitch + dy * 0.0045));
                }
            }
        }, { passive: true });

        const endCamHandler = e => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === cameraTouchId) {
                    cameraTouchId = null;
                    cameraTouchActive = false;
                }
            }
        };
        camZone.addEventListener('touchend', endCamHandler);
        camZone.addEventListener('touchcancel', endCamHandler);

        // Вспомогательная привязка сенсорных кнопок (удержание)
        function bindHoldButton(btnId, onDown, onUp) {
            const btn = document.getElementById(btnId);
            const start = e => {
                e.preventDefault();
                e.stopPropagation();
                btn.classList.add('active');
                onDown();
            };
            const end = e => {
                e.preventDefault();
                e.stopPropagation();
                btn.classList.remove('active');
                onUp();
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        bindHoldButton('btn-jump', () => { input.jump = true; }, () => { input.jump = false; });
        bindHoldButton('btn-gas', () => { input.gas = true; }, () => { input.gas = false; });
        bindHoldButton('btn-brake', () => { input.brake = true; }, () => { input.brake = false; });

        // Кнопки посадки / выхода из авто
        function bindTapButton(btnId, action) {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();
                action();
            }, { passive: false });
            btn.addEventListener('click', e => {
                e.preventDefault();
                action();
            });
        }

        bindTapButton('btn-enter-car', () => {
            if (state.mode === 'onfoot' && state.nearestVehicle) {
                enterVehicle(state.nearestVehicle);
            }
        });

        bindTapButton('btn-exit-car', () => {
            if (state.mode === 'incar') {
                exitVehicle();
            }
        });

        // Клавиатура и мышь (для удобства проверки на ПК)
        window.addEventListener('keydown', e => {
            input.keys[e.code] = true;
            if (e.code === 'KeyF' || e.code === 'KeyE') {
                if (state.mode === 'onfoot' && state.nearestVehicle) {
                    enterVehicle(state.nearestVehicle);
                } else if (state.mode === 'incar') {
                    exitVehicle();
                }
            }
        });

        window.addEventListener('keyup', e => {
            input.keys[e.code] = false;
        });

        let mouseDragging = false;
        camZone.addEventListener('mousedown', e => {
            mouseDragging = true;
            cameraTouchActive = true;
            lastCamX = e.clientX;
            lastCamY = e.clientY;
        });
        window.addEventListener('mousemove', e => {
            if (!mouseDragging) return;
            const dx = e.clientX - lastCamX;
            const dy = e.clientY - lastCamY;
            lastCamX = e.clientX;
            lastCamY = e.clientY;
            state.cameraYaw -= dx * 0.005;
            state.cameraPitch = Math.max(0.12, Math.min(0.85, state.cameraPitch + dy * 0.004));
        });
        window.addEventListener('mouseup', () => {
            mouseDragging = false;
            cameraTouchActive = false;
        });

        // Кнопка скрытия предупреждения об ориентации
        document.getElementById('dismiss-orientation').addEventListener('click', () => {
            document.getElementById('orientation-warning').classList.remove('active-warning');
        });

        // Адаптация размера холста при повороте экрана или ресайзе окна
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 120));

        // ================= ЗАПУСК И ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ =================
        buildCity();
        initVehicles();
        initPedestrians();
        initMoneyPickups();

        let lastTime = performance.now();
        let minimapFrameCounter = 0;

        function animate(now) {
            requestAnimationFrame(animate);

            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            const elapsed = now * 0.001;

            if (state.mode === 'onfoot') {
                updatePlayerOnFoot(dt);
            }
            updateVehicles(dt);
            updatePedestrians(dt);
            updatePickups(dt, elapsed);
            updateCamera(dt);

            // Рендерим 2D мини-карту каждые 2 кадра для экономии CPU на смартфонах
            minimapFrameCounter++;
            if (minimapFrameCounter % 2 === 0) {
                renderMinimap();
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            onWindowResize();
            lastTime = performance.now();
            requestAnimationFrame(animate);
        };
    })();
    </script>
</body>
</html>
